function initIdb(){

/* MOTOR FINANCEIRO PROFISSIONAL DE ALTA PRECISÃO */
function calcularFinanceiro(orc){
  const cfg=db.cfg;
  const l=orc.logistica;
  const f=orc.financeiro;

  // 1. Custos e Vendas dos Itens
  let custoMateriais=0;
  let vendaItens=0;
  orc.itens.forEach(it=>{
    const qtd=N(it.qtd);
    const perda=1 + (N(it.perda)/100);
    custoMateriais += qtd * perda * N(it.custo);
    vendaItens += qtd * N(it.preco);
  });

  // 2. Mão de Obra
  const dias=Math.max(1, N(l.diasObra)||1);
  const custoMaoObra = dias * (
    (N(l.numJardineiros)||0) * N(cfg.diariaJardineiro) +
    (N(l.numAjudantes)||0) * N(cfg.diariaAjudante)
  );

  // 3. Combustível e Logística
  const kmIda=N(l.distanciaKm);
  const totalKm = kmIda * 2 * (N(l.viagens)||1);
  const consumo=Math.max(1, N(cfg.kmL)||9.5);
  const custoCombustivel = (totalKm / consumo) * N(cfg.gas);
  const custoLogistica = custoCombustivel + N(l.custoExtra);

  // 4. Repasse de Deslocamento
  let deslocamentoCobrado=0;
  if(l.repasse==='total') deslocamentoCobrado = custoLogistica;
  else if(l.repasse==='embutido') deslocamentoCobrado = 0; // embutido na margem

  // 5. Custo Total da Obra
  const custoTotal = custoMateriais + custoMaoObra + custoLogistica;

  // 6. Preço Bruto e Desconto
  const precoBruto = vendaItens + deslocamentoCobrado;
  const valorDesconto = precoBruto * (N(f.descontoPct)/100);
  const precoFinalCliente = Math.max(0, precoBruto - valorDesconto);

  // 7. Imposto e Lucro Líquido
  const valorImposto = precoFinalCliente * (N(f.impostoPct)/100);
  const lucroLiquidoReal = precoFinalCliente - custoTotal - valorImposto;
  const margemLiquidaReal = precoFinalCliente > 0 ? (lucroLiquidoReal / precoFinalCliente) * 100 : 0;

  // 8. Preço Sugerido pela Margem Alvo
  const mAlvo = N(cfg.margemAlvo) / 100;
  const mImp = N(f.impostoPct) / 100;
  const divisor = 1 - mAlvo - mImp;
  const precoSugeridoIdeal = divisor > 0 ? (custoTotal / divisor) : custoTotal * 1.5;

  return {
    custoMateriais,
    custoMaoObra,
    custoCombustivel,
    custoLogistica,
    custoTotal,
    deslocamentoCobrado,
    precoBruto,
    valorDesconto,
    precoFinalCliente,
    valorImposto,
    lucroLiquidoReal,
    margemLiquidaReal,
    precoSugeridoIdeal,
    abaixoMinimo: margemLiquidaReal < N(cfg.margemMinima)
  };
}

function nav(v){
  view=v;
  draw();

function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('jp_pro_theme',next);
  draw();
}

function draw(){
  const th=localStorage.getItem('jp_pro_theme')||'dark';
  document.documentElement.setAttribute('data-theme',th);

  $('#hd').innerHTML=`
    <div class="brand">
      ${LOGO}
      <div>
        <h1>${E(db.cfg.empresa)}</h1>
        <small>Orçamento & Engenharia de Preços</small>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">${th==='light'?'🌙 Dark':'☀️ Light'}</button>
  `;

  const tabs=[
    ['edit','📝','Orçamento'],
    ['list','📁','Orçamentos'],
    ['cat','🏷️','Preços'],
    ['cfg','⚙️','Parâmetros']
  ];
  $('#nv').innerHTML=tabs.map(t=>`<button class="${t[0]===view?'on':''}" onclick="nav('${t[0]}')"><span class="icon">${t[1]}</span>${t[2]}</button>`).join('');

  let h='';
  if(view==='edit') h=renderEditor();
  else if(view==='list') h=renderLista();
  else if(view==='cat') h=renderCatalogo();
  else if(view==='cfg') h=renderConfig();

  $('#m').innerHTML=h;
}

/* =====================================================================

function abrirConfiguradorVisual(catId){
  visualAtivo = (visualAtivo===catId ? null : catId);
  const container = $('#visual-config-box');
  if(!container){ draw(); return; }

  if(!visualAtivo){
    container.innerHTML='';
    document.querySelectorAll('.visual-card').forEach(c=>c.classList.remove('active'));
    return;
  }

  document.querySelectorAll('.visual-card').forEach(c=>c.classList.remove('active'));
  const cardEl = event.currentTarget;
  if(cardEl) cardEl.classList.add('active');

  const cat=db.cat.find(c=>c.id===catId);
  if(!cat) return;

  let optsHtml = cat.opcoes.map((op,i)=>`
    <div style="background:var(--card2);border:1px solid var(--br);padding:10px 14px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div>
        <b style="font-size:14px;color:var(--tx)">${E(op.n)}</b>
        <div style="font-size:12px;color:var(--mut)">Custo Ref.: ${R(op.custo)} / Venda Sugerida: <b style="color:var(--g)">${R(op.venda)} por ${cat.un}</b></div>
      </div>
      <button class="b sm" onclick="adicionarOpcaoRapida('${cat.id}', ${i})">+ Adicionar</button>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="visual-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;color:var(--g)">${cat.ic} ${E(cat.nome)} — Opções & Preços Base</h3>
        <button class="b sm d" onclick="abrirConfiguradorVisual(null)">Fechar</button>
      </div>
      <p class="mut" style="font-size:12px;margin-bottom:12px">${E(cat.desc)}</p>
      ${optsHtml}
    </div>
  `;
}

function adicionarOpcaoRapida(catId, opIdx){
  const cat=db.cat.find(c=>c.id===catId);
  if(!cat) return;
  const op=cat.opcoes[opIdx];
  if(!op) return;

  curOrc.itens.push({
    nome: cat.nome + ' — ' + op.n,
    qtd: cat.un==='m²'? 100 : cat.un==='mês'? 1 : 1,
    un: cat.un,
    custo: op.custo,
    preco: op.venda,
    perda: cat.perda||0
  });

  saveData();
  draw();
  toast('Item adicionado ✓');
}

            <td class="n">100.0%</td>
          </tr>
        </tbody>
      </table>

      <h3>Demonstrativo de Resultado Líquido</h3>
      <table>
        <tr><td>Receita Bruta Cobrada do Cliente</td><td class="n"><b>${R(fin.precoFinalCliente)}</b></td></tr>
        <tr><td>(-) Custo Total Operacional</td><td class="n" style="color:#b3261e">- ${R(fin.custoTotal)}</td></tr>
        <tr><td>(-) Impostos Estimados (${o.financeiro.impostoPct}%)</td><td class="n" style="color:#b3261e">- ${R(fin.valorImposto)}</td></tr>
        <tr style="font-size:16px;font-weight:bold;color:#0b5d32;background:#e1f0e6">
          <td>(=) LUCRO LÍQUIDO REAL</td>
          <td class="n">${R(fin.lucroLiquidoReal)}</td>
        </tr>
        <tr>
          <td><b>Margem Líquida Real</b></td>
          <td class="n"><b>${fin.margemLiquidaReal.toFixed(2)}%</b> (Piso mínimo: ${cfg.margemMinima}%)</td>
        </tr>
      </table>
    `;
  }

  $('#doc').innerHTML = bar + `<div class="pg">${body}</div>`;
  $('#doc').style.display = 'block';
  $('#doc').scrollTop = 0;
}

function fecharDocumento(){
  $('#doc').style.display='none';
}

function compartilharWhatsApp(){
  if(!curOrc) return;
  const o=curOrc;
  const fin=calcularFinanceiro(o);
  const cfg=db.cfg;

  let msg = `Olá, *${o.cliente.nome||'Cliente'}*!\n`;
  msg += `Aqui está a sua *Proposta Comercial ${o.num}* da *${cfg.empresa}*:\n\n`;
  msg += `📍 *Local:* ${o.local||'A combinar'}\n\n`;
  msg += `📋 *Serviços & Insumos:*\n`;
  o.itens.forEach(it=>{
    msg += `• *${it.nome}*: ${it.qtd} ${it.un} — ${R(it.qtd * it.preco)}\n`;
  });
  if(fin.deslocamentoCobrado > 0){
    msg += `• *Deslocamento & Logística*: ${R(fin.deslocamentoCobrado)}\n`;
  }
  if(fin.valorDesconto > 0){
    msg += `\n🏷️ *Desconto Concedido:* - ${R(fin.valorDesconto)}\n`;
  }
  msg += `\n💰 *Total da Proposta:* *${R(fin.precoFinalCliente)}*\n`;
  msg += `💳 *Condições:* ${cfg.pagto}\n`;
  msg += `⏳ *Validade:* ${cfg.validadeDias} dias\n\n`;
  msg += `Ficamos à disposição para agendar o início dos trabalhos!`;

  const tel=(o.cliente.tel||'').replace(/\D/g,'');
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank');
}

/* =====================================================================
   LISTA DE ORÇAMENTOS
   ===================================================================== */
function renderLista(){
  const orcs=db.orcamentos;
  if(!orcs.length){
    return `
      <div class="card" style="text-align:center;padding:30px">
        <h2>Nenhum orçamento cadastrado</h2>
        <p class="mut">Comece criando o primeiro orçamento profissional da sua equipe.</p>
        <button class="b" onclick="criarNovoOrcamento()">+ Criar Orçamento</button>
      </div>
    `;
  }

  const aprovados = orcs.filter(o=>o.status==='aprovado').reduce((s,o)=>s+calcularFinanceiro(o).precoFinalCliente,0);
  const abertos = orcs.filter(o=>o.status==='enviado'||o.status==='rascunho').reduce((s,o)=>s+calcularFinanceiro(o).precoFinalCliente,0);

  return `
    <div class="r" style="margin-bottom:12px">
      <div class="card" style="margin:0;text-align:center;padding:12px">
        <small class="mut">Em Negociação</small>
        <div style="font-size:20px;font-weight:800;color:var(--gold);margin-top:4px">${R(abertos)}</div>
      </div>
      <div class="card" style="margin:0;text-align:center;padding:12px">
        <small class="mut">Aprovados</small>
        <div style="font-size:20px;font-weight:800;color:var(--g);margin-top:4px">${R(aprovados)}</div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h2>Orçamentos (${orcs.length})</h2>
        <button class="b sm" onclick="criarNovoOrcamento()">+ Novo</button>
      </div>

      ${orcs.map(o=>{
        const fin=calcularFinanceiro(o);
        return `
          <div class="item-box">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <b style="font-size:16px">${E(o.num)}</b> — ${E(o.cliente.nome||'Sem cliente')}<br>
                <small class="mut">${o.data} • ${E(o.local||'Sem local')} • Status: <b>${o.status.toUpperCase()}</b></small>
              </div>
              <div style="text-align:right">
                <div style="font-size:17px;font-weight:800;color:var(--g)">${R(fin.precoFinalCliente)}</div>
                <small class="fin-badge ${fin.abaixoMinimo?'badge-warn':'badge-good'}">
                  Margem: ${fin.margemLiquidaReal.toFixed(1)}%
                </small>
              </div>
            </div>

            <div class="row" style="margin-top:10px">
              <button class="b sm" onclick="abrirParaEdicao('${o.id}')">Editar</button>
              <button class="b sm s" onclick="curOrc=db.orcamentos.find(x=>x.id==='${o.id}');abrirDocumento('cli')">Proposta</button>
              <button class="b sm s" onclick="curOrc=db.orcamentos.find(x=>x.id==='${o.id}');abrirDocumento('int')">Interno</button>
              <button class="b sm s" onclick="duplicarOrcamento('${o.id}')">Duplicar</button>
              <button class="b sm d" onclick="excluirOrcamento('${o.id}')">
                ${delConfirmId===o.id?'Confirmar Exclusão?':'Excluir'}
              </button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function abrirParaEdicao(id){
  curOrc=db.orcamentos.find(o=>o.id===id);
  visualAtivo=null;
  nav('edit');
}

function duplicarOrcamento(id){
  const orig=db.orcamentos.find(o=>o.id===id);
  if(!orig) return;
  const clone=JSON.parse(JSON.stringify(orig));
  clone.id='jp_'+Date.now();
  clone.num='JP-'+new Date().getFullYear()+'-'+String(db.seq++).padStart(3,'0');
  clone.status='rascunho';
  clone.data=new Date().toISOString().slice(0,10);
  db.orcamentos.unshift(clone);
  saveData();
  draw();
  toast('Orçamento duplicado ✓');
}

function excluirOrcamento(id){
  if(delConfirmId!==id){
    delConfirmId=id;
    draw();
    return;
  }
  db.orcamentos=db.orcamentos.filter(o=>o.id!==id);
  if(curOrc&&curOrc.id===id) curOrc=null;
  delConfirmId=null;
  saveData();
  draw();
  toast('Orçamento excluído');
}

        </div>

    <div class="card">
      <h2>Backup & Dados</h2>
      <p class="mut">Exporte seus orçamentos e configurações para salvar no computador ou transferir para outro celular.</p>
      <div class="row">
        <button class="b s" onclick="exportarBackup()">💾 Baixar Backup Completo (JSON)</button>
        <button class="b s" onclick="$('#fileInp').click()">📥 Restaurar Backup</button>
        <input type="file" id="fileInp" style="display:none" accept=".json" onchange="importarBackup(this)">

function exportarBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='jardim-padrao-orcamentos-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function importarBackup(inp){
  const file=inp.files[0];
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(data && data.cfg){
        db=data;
        saveData();
        draw();
        toast('Backup restaurado ✓');
      }
    }catch(e){alert('Arquivo de backup inválido')}
  };
  r.readAsText(file);
}

loadData().then(d=>{

  draw();
});
